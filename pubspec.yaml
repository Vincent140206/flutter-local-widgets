name: local_widgets
publish_to: none
description: Still - fully offline photo, Bible, and watchlist widgets.
version: 1.1.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  home_widget: ^0.10.0
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  path: ^1.9.1
  sqflite: ^2.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bible/bible.db
    - assets/bible/curated_widget.json
    - assets/bible/dataset_manifest.json
